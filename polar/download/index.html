<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Polar</title>
<meta name="description" content="Download Polar: Strategy Board Game on the App Store or Google Play.">
<style>
  :root {
    --bg: #f5f7fa; --fg: #14202e; --muted: #5b6b7d;
    --card: #ffffff; --border: #dbe2ea; --accent: #1f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e141b; --fg: #eaf0f6; --muted: #8fa0b3; --card: #16202b; --border: #263444; --accent: #58a6ff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 2rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 28px; line-height: 1.5; }
  .stores { display: grid; gap: 12px; }
  a.store {
    display: block; padding: 16px 20px; border-radius: 12px; text-decoration: none;
    background: var(--card); border: 1px solid var(--border); color: var(--fg);
    font-weight: 600; transition: border-color .15s, transform .15s;
  }
  a.store:hover, a.store:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
  a.store small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }
  #redirecting { display: none; }
  .redirecting #redirecting { display: block; }
  .redirecting .stores { opacity: .85; }
  noscript p { margin-top: 16px; }
</style>
</head>
<body>
<main id="app">
  <h1>Polar</h1>
  <p id="redirecting">Taking you to the store&hellip; If nothing happens, tap below.</p>
  <p id="default-msg">Download Polar: Strategy Board Game on your device.</p>
  <div class="stores">
    <a class="store" id="ios" href="https://apps.apple.com/app/id6813479817">
      Download on the App Store<small>iPhone &amp; iPad</small>
    </a>
    <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.kerygmacode.polar">
      Get it on Google Play<small>Android</small>
    </a>
  </div>
</main>

<script>
  (function () {
    var ua = navigator.userAgent || "";
    // iPadOS 13+ reports as Mac, so check for touch support too.
    var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);

    var target = null;
    if (isIOS) target = document.getElementById("ios").href;
    else if (isAndroid) target = document.getElementById("android").href;

    if (target) {
      document.getElementById("app").className = "redirecting";
      document.getElementById("default-msg").style.display = "none";
      // replace() keeps the redirect page out of the back-button history
      window.location.replace(target);
    }
    // Desktop and anything else: just show both buttons.
  })();
</script>
</body>
</html>
