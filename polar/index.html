<!DOCTYPE html><html><head>
  <base href="/polar/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Polar — a round, 97-square strategy board game.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Polar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <meta name="mobile-web-app-capable" content="yes">

  <title>Polar</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #1A1915;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <style id="password-gate-style">
    #password-gate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #1A1915;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gate-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 260px;
      padding: 0 16px;
    }
    #gate-title {
      color: #EDEDE8;
      text-align: center;
      font-size: 15px;
      margin-bottom: 4px;
    }
    #gate-password {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #45443c;
      background: #28271f;
      color: #EDEDE8;
      font-size: 15px;
      outline: none;
    }
    #gate-password:focus {
      border-color: #4FC3E0;
    }
    #gate-form button {
      padding: 10px 12px;
      border-radius: 6px;
      border: none;
      background: #4FC3E0;
      color: #1A1915;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    #gate-error {
      color: #e08a8a;
      font-size: 13px;
      text-align: center;
      min-height: 16px;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <div id="password-gate">
    <form id="gate-form">
      <div id="gate-title">This page is private.</div>
      <input id="gate-password" type="password" autocomplete="current-password" placeholder="Password" autofocus>
      <button type="submit">Enter</button>
      <div id="gate-error"></div>
    </form>
  </div>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  
  



  <script id="password-gate-script">
    (function () {
      // Off for now (testing phase - Greg wants max visibility while the
      // native apps aren't live yet). Flip back to true once the App
      // Store/Play Store listings go live and this should go private again.
      var GATE_ENABLED = false;
      var STORAGE_KEY = "polar_gate_unlocked_v1";
      var HASH = "e484af475beb9d163205e551b66e237ebd33b1b4bcd47ecc92d51456fa33e6e7";

      function sha256Hex(str) {
        var enc = new TextEncoder().encode(str);
        return crypto.subtle.digest("SHA-256", enc).then(function (buf) {
          return Array.prototype.map
            .call(new Uint8Array(buf), function (b) {
              return b.toString(16).padStart(2, "0");
            })
            .join("");
        });
      }

      function unlock() {
        var gate = document.getElementById("password-gate");
        if (gate) gate.remove();
        var s = document.createElement("script");
        s.src = "flutter_bootstrap.js";
        s.async = true;
        document.body.appendChild(s);
      }

      if (!GATE_ENABLED) {
        unlock();
        return;
      }

      try {
        if (localStorage.getItem(STORAGE_KEY) === "1") {
          unlock();
          return;
        }
      } catch (e) {}

      document.getElementById("gate-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var input = document.getElementById("gate-password");
        var val = input.value;
        sha256Hex(val).then(function (hash) {
          if (hash === HASH) {
            try {
              localStorage.setItem(STORAGE_KEY, "1");
            } catch (e) {}
            unlock();
          } else {
            document.getElementById("gate-error").textContent = "Incorrect password.";
            input.value = "";
            input.focus();
          }
        });
      });
    })();
  </script>
</body></html>
